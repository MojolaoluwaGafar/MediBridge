# Render Blueprint for MediBridge: the API (apps/Server) and the web client
# (apps/Client, a static site). Both deploy from the `test` branch once CI
# passes on it.
#
# Fresh deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
# The "-v2" service names keep it from clashing with the first deployment
# (medibridge-api / medibridge-client); delete those, and their old Blueprint,
# once this one works. Render asks for every "sync: false" value when it
# creates each service; anything left empty can be set later under that
# service's Environment tab.
#
# Connecting the two takes one value, entered when Render asks for it:
#   - client VITE_BASE_URL = the API's public URL. Render names it after the
#     service: https://medibridge-api-v2.onrender.com (check the API's page in
#     the dashboard; Render adds a suffix if the name was already taken).
# The API already allows https://medibridge-client-v2*.onrender.com, so no CORS
# setting is needed. Render can't hand one service's public URL to another
# automatically (fromService only gives the private-network host).

services:
  - type: web
    name: medibridge-api-v2
    runtime: node
    plan: free
    region: frankfurt
    branch: test
    # Deploy only after the CI workflow passes on this branch.
    autoDeployTrigger: checksPass
    # The repo is an npm workspace with one lockfile at the root, so install
    # and build from the root. --include=dev keeps TypeScript available even
    # though NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build -w @medibridge/server
    startCommand: npm run start -w @medibridge/server
    healthCheckPath: /
    # Skip deploys for changes that can't affect the API.
    buildFilter:
      paths:
        - apps/Server/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Render puts one proxy in front of the app (used by the rate limiter).
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Render's edge already compresses responses with Brotli, so the app
      # doesn't (it would only cost CPU). See docs/architecture/performance.md.
      - key: ENABLE_COMPRESSION
        value: "false"

      # Database
      - key: DB_CONNECTION_URL
        sync: false

      # Auth. Generated once by Render; changing it signs everyone out.
      - key: JWT_SECRET_KEY
        generateValue: true

      # Only for a custom domain on the client, e.g. https://portal.example.com.
      # medibridge-client-v2*.onrender.com and *.vercel.app are allowed in code.
      - key: CLIENT_ORIGIN
        sync: false
      # Any other allowed browser origins, comma separated.
      - key: CORS_ORIGINS
        sync: false

      # Appointments (see docs/architecture/api.md)
      - key: HOSPITAL_TIMEZONE
        value: Africa/Lagos
      - key: APPOINTMENT_SLOT_MINUTES
        value: "30"
      # The Terms page and reschedule screen say 7 days; change them together.
      - key: RESCHEDULE_NOTICE_DAYS
        value: "7"

      # AI (see docs/architecture/ai.md)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TRIAGE_MODEL
        value: llama-3.1-8b-instant
      - key: HOSPITAL_EMERGENCY_NUMBER
        sync: false

      # Email. In production only Brevo is used; SMTP is skipped.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # SMS for activation and reset codes (see docs/architecture/phone-verification.md).
      # termii | twilio | none. Leave empty for none: codes then go by email only.
      - key: SMS_PROVIDER
        sync: false
      - key: DEFAULT_PHONE_COUNTRY
        value: NG
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: TERMII_BASE_URL
        value: https://v3.api.termii.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

      # Cloudinary (profile photos and seed scripts)
      - key: CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # The React app, served as static files. Static sites are free and don't
  # sleep, unlike free web services.
  - type: web
    name: medibridge-client-v2
    runtime: static
    branch: test
    autoDeployTrigger: checksPass
    # Install from the root (one shared lockfile). --include=dev keeps
    # TypeScript and Vite available whatever NODE_ENV is.
    buildCommand: npm ci --include=dev && npm run build -w @medibridge/client
    staticPublishPath: ./apps/Client/dist
    # Skip deploys for changes that can't affect the client.
    buildFilter:
      paths:
        - apps/Client/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    # The app does its own routing, so every path serves index.html
    # (/patientDashboard, /login, ... would otherwise 404 on refresh).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built assets have content hashes in their names, so cache them forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Basic hardening for a health portal.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # VITE_* values are baked in at build time: redeploy after changing them.
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's public URL: https://medibridge-api-v2.onrender.com unless Render
      # added a suffix. Changing it later needs a client redeploy.
      - key: VITE_BASE_URL
        sync: false
      # Shown on the Contact page; leave any empty to hide that line.
      - key: VITE_HOSPITAL_PHONE
        sync: false
      - key: VITE_HOSPITAL_EMAIL
        sync: false
      - key: VITE_HOSPITAL_ADDRESS
        sync: false
      - key: VITE_HOSPITAL_HOURS
        sync: false
