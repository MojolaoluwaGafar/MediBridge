<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Fonts load from here, not from an @import in the CSS, so the browser
         starts fetching them straight away instead of after the stylesheet.
         One request for both families; display=swap shows text immediately. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Outfit:wght@100..900&display=swap"
    />
  </head>

  </body>
